<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>n8n Ingestion Workflow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · n8n · 2 of 2</p>
    <h1>Inside the ingestion workflow</h1>

    <svg viewBox="0 0 1000 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="n8n-ingestion-title n8n-ingestion-desc">
      <title id="n8n-ingestion-title">n8n ingestion workflow</title>
      <desc id="n8n-ingestion-desc">Flowchart of the ingestion workflow: classify the email, loop over each attachment to fetch, extract and normalise it, flag failures for human review, then compare the bill of lading against the shipping instruction.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zone: per-attachment loop body (behind arrows and nodes) -->
      <rect x="280" y="276" width="320" height="312" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="292" y="292" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">PER ATTACHMENT · LOOP</text>

      <!-- Arrows (drawn first, behind nodes) -->
      <line x1="260" y1="80"  x2="320" y2="80"  stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="440" y1="112" x2="440" y2="148" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="440" y1="244" x2="440" y2="308" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="440" y1="372" x2="440" y2="404" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="440" y1="468" x2="440" y2="500" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Any step fails → flag for review (dashed) -->
      <line x1="600" y1="436" x2="700" y2="436" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- Loop back: success and failure merge at the dot, then return to the decision -->
      <line x1="320" y1="532" x2="220" y2="532" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
      <path d="M810,468 V616 Q810,624 802,624 H228 Q220,624 220,616 V532" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
      <path d="M220,532 V204 Q220,196 228,196 H340" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <circle cx="220" cy="532" r="4" fill="#2d3142"/>

      <!-- No attachments left → compare -->
      <path d="M540,196 H952 Q960,196 960,204 V688 Q960,696 952,696 H560" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="440" y1="728" x2="440" y2="760" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="448" y="254" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="462" y="263" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

      <rect x="608" y="414" width="84" height="12" rx="2" fill="#f5f5f5"/>
      <text x="650" y="423" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ANY STEP FAILS</text>

      <rect x="266" y="176" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="282" y="185" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NEXT</text>

      <rect x="590" y="174" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="602" y="183" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

      <!-- N1 Start: drain hands over a row -->
      <rect x="80" y="56" width="180" height="48" rx="24" fill="#f5f5f5"/>
      <rect x="80" y="56" width="180" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="170" y="78" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Drain hands over a row</text>
      <text x="170" y="92" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Execute Workflow · Start</text>

      <!-- N2 Read + classify -->
      <rect x="320" y="48" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="440" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Read + classify email</text>
      <text x="440" y="86" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Drive JSON · Vertex LLM · 5 intents</text>
      <text x="440" y="99" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">email logged to Firestore</text>

      <!-- N3 Decision: attachments left? -->
      <polygon points="440,148 540,196 440,244 340,196" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="440" y="194" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Attachments</text>
      <text x="440" y="208" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">left?</text>

      <!-- N4 Fetch attachment -->
      <rect x="320" y="308" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="440" y="332" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fetch attachment</text>
      <text x="440" y="346" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Drive lookup by filename</text>
      <text x="440" y="359" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">retry 6 × 30 s if missing</text>

      <!-- N5 Extract text -->
      <rect x="320" y="404" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="440" y="428" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Extract text</text>
      <text x="440" y="442" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">TXT · PDF · XLSX · DOCX</text>
      <text x="440" y="455" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">scanned PDFs → Google Vision OCR</text>

      <!-- N6 Normalise + validate -->
      <rect x="320" y="500" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="440" y="524" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Normalise + validate</text>
      <text x="440" y="538" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Vertex LLM → 7 BL / SI fields</text>
      <text x="440" y="551" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">UN/LOCODE port check → Firestore</text>

      <!-- N7 Flag for human review -->
      <rect x="700" y="404" width="220" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="810" y="428" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Flag for human review</text>
      <text x="810" y="442" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">status: needs_review</text>
      <text x="810" y="455" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">error saved · loop continues</text>

      <!-- N8 Focal: compare BL vs SI -->
      <rect x="320" y="664" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="664" width="240" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="440" y="688" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Compare BL vs SI</text>
      <text x="440" y="702" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">deterministic · 7 fields + ports</text>
      <text x="440" y="715" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">formatting vs real diffs → Firestore</text>

      <!-- N9 End: back to the drain -->
      <rect x="340" y="760" width="200" height="48" rx="24" fill="#f5f5f5"/>
      <rect x="340" y="760" width="200" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="440" y="782" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Back to the drain</text>
      <text x="440" y="796" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">row marked done / failed</text>

      <!-- Legend -->
      <line x1="40" y1="836" x2="960" y2="836" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="852" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="864" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="72" y="874" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Start / end</text>

      <rect x="150" y="864" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="182" y="874" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Step</text>

      <polygon points="240,870 252,864 264,870 252,876" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="272" y="874" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Decision</text>

      <rect x="340" y="864" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="372" y="874" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Key output</text>

      <rect x="450" y="864" width="24" height="12" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="482" y="874" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Loop body</text>

      <line x1="560" y1="870" x2="588" y2="870" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="596" y="874" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Flow</text>

      <line x1="650" y1="870" x2="678" y2="870" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="686" y="874" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Loop back / failure path</text>

      <circle cx="838" cy="870" r="4" fill="#2d3142"/>
      <text x="850" y="874" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Merge</text>
    </svg>
  </div>
</body>
</html>
