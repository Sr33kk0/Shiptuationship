<svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="n8n-overview-title n8n-overview-desc">
  <title id="n8n-overview-title">n8n pipeline overview</title>
  <desc id="n8n-overview-desc">Flowchart of how mail sent to a +ship alias is copied to Drive, queued in Firestore, ingested one email at a time and written back to Firestore, plus a separate auto-reply webhook.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- Arrows (drawn first, behind nodes) -->
  <line x1="380" y1="88"  x2="380" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="380" y1="184" x2="380" y2="216" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="380" y1="280" x2="380" y2="312" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="490" y1="368" x2="600" y2="368" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="380" y1="424" x2="380" y2="456" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="380" y1="520" x2="380" y2="552" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Loop back: Mark done / failed → next queue row (dashed = return) -->
  <path d="M260,584 H228 Q220,584 220,576 V496 Q220,488 228,488 H260" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <line x1="500" y1="488" x2="600" y2="488" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Arrow labels -->
  <rect x="388" y="194" width="60" height="12" rx="2" fill="#f5f5f5"/>
  <text x="418" y="203" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VIA DRIVE</text>

  <rect x="388" y="288" width="60" height="12" rx="2" fill="#f5f5f5"/>
  <text x="418" y="297" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VIA QUEUE</text>

  <rect x="528" y="346" width="34" height="12" rx="2" fill="#f5f5f5"/>
  <text x="545" y="355" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

  <rect x="388" y="434" width="28" height="12" rx="2" fill="#f5f5f5"/>
  <text x="402" y="443" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

  <rect x="388" y="530" width="64" height="12" rx="2" fill="#f5f5f5"/>
  <text x="420" y="539" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OK / ERROR</text>

  <rect x="160" y="530" width="52" height="12" rx="2" fill="#f5f5f5"/>
  <text x="186" y="539" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NEXT ROW</text>

  <rect x="530" y="466" width="40" height="12" rx="2" fill="#f5f5f5"/>
  <text x="550" y="475" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WRITES</text>

  <!-- N1 Start: +ship email arrives -->
  <rect x="280" y="40" width="200" height="48" rx="24" fill="#f5f5f5"/>
  <rect x="280" y="40" width="200" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text x="380" y="62" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">+ship email arrives</text>
  <text x="380" y="76" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Gmail alias</text>

  <!-- N2 gmail-ship-to-drive -->
  <rect x="260" y="120" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="380" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Copy mail to Drive</text>
  <text x="380" y="158" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gmail-ship-to-drive</text>
  <text x="380" y="171" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">every 1 min · label ship-exported</text>

  <!-- N3 ingestion-trigger -->
  <rect x="260" y="216" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="380" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Queue new Drive files</text>
  <text x="380" y="254" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ingestion-trigger</text>
  <text x="380" y="267" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">every 1 min · up to 20 files</text>

  <!-- N4 Decision: drain already running? -->
  <polygon points="380,312 490,368 380,424 270,368" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="380" y="360" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Drain already</text>
  <text x="380" y="374" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">running?</text>
  <text x="380" y="392" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ingestion-drain</text>

  <!-- N8 End: skip this tick -->
  <rect x="600" y="344" width="240" height="48" rx="24" fill="#f5f5f5"/>
  <rect x="600" y="344" width="240" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text x="720" y="366" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Skip this tick</text>
  <text x="720" y="380" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">another drain is mid-email</text>

  <!-- N5 Focal: claim + ingest -->
  <rect x="260" y="456" width="240" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="260" y="456" width="240" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <text x="380" y="480" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Claim + ingest one email</text>
  <text x="380" y="494" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">claim row → ingestion workflow</text>
  <text x="380" y="507" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">stuck rows (&gt;15 min) requeued first</text>

  <!-- N6 Mark done / failed -->
  <rect x="260" y="552" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="380" y="576" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mark done / failed</text>
  <text x="380" y="590" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">queue row status + last_error</text>
  <text x="380" y="603" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">up to 20 rows per run</text>

  <!-- N7 Store: Firestore -->
  <rect x="600" y="456" width="240" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="600" y="456" width="240" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <text x="720" y="480" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Firestore</text>
  <text x="720" y="494" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">emails · BL / SI fields · comparison</text>
  <text x="720" y="507" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">also holds the ingest queue</text>

  <!-- N9 Optional / async: auto-reply webhook -->
  <rect x="600" y="552" width="240" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="600" y="552" width="240" height="64" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="608" y="558" width="48" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
  <text x="632" y="567" fill="rgba(45,49,66,0.70)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WEBHOOK</text>
  <text x="720" y="590" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">LLM drafts a reply</text>
  <text x="720" y="604" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">auto-reply · called by the web app</text>

  <!-- Legend -->
  <line x1="40" y1="644" x2="960" y2="644" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="40" y="660" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

  <rect x="40" y="672" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text x="72" y="682" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Start / end</text>

  <rect x="150" y="672" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="182" y="682" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Workflow step</text>

  <polygon points="272,678 284,672 296,678 284,684" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="304" y="682" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Decision</text>

  <rect x="372" y="672" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <text x="404" y="682" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Core workflow</text>

  <rect x="494" y="672" width="24" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <text x="526" y="682" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Data store</text>

  <rect x="602" y="672" width="24" height="12" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="634" y="682" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Separate trigger</text>

  <line x1="738" y1="678" x2="766" y2="678" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="774" y="682" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Handoff</text>

  <line x1="830" y1="678" x2="858" y2="678" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="866" y="682" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Loop back</text>
</svg>
